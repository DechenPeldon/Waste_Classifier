{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Waste Classifier{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'classifier/css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>♻️ Smart Waste Classifier</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a></li>
                <li><a href="{% url 'about' %}" class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}">About</a></li>
            </ul>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Smart Waste Classifier. Helping make recycling easier.</p>
        </div>
    </footer>

    <script src="{% static 'classifier/js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
